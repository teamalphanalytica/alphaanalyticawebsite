[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"

# Security headers for every page
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The client portal: never cached, never framed, scripts only from this site
[[headers]]
  for = "/portal/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

# Call tracking script that client websites include: cache briefly so fixes reach sites quickly
[[headers]]
  for = "/call-tracking.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"
